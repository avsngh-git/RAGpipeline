[build-system]
requires =["setuptools"]
build-backend ="setuptools.build_meta"

[project]
name = "scientific-research-platform"
version = "0.1.0"
description = "A scientific literature research platform"
dependencies = [
    "asyncpg",
    "bm25s==0.3.11",
    "fastapi",
    "httpx",
    "langgraph==1.2.9",
    "langgraph-checkpoint-postgres==3.1.3",
    "mcp==2.3.0",
    "opentelemetry-api==1.45.1",
    "opentelemetry-exporter-otlp-proto-http==1.45.1",
    "opentelemetry-sdk==1.45.1",
    "prometheus-client==0.26.0",
    "psycopg==3.3.4",
    "psycopg-pool==3.3.3",
    "uvicorn",
]

[project.optional-dependencies]
pdf = [
    "docling==2.130.0",
    "docling-core==2.98.0",
    "docling-ibm-models==4.0.3",
    "docling-parse==7.21.0",
    "rapidocr==3.9.2",
]
embeddings = [
    # CUDA build from https://download.pytorch.org/whl/cu130; "==2.14.0" also matches
    # the "+cu130" local version.
    "torch==2.14.0",
    "sentence-transformers==6.1.0",
    "transformers==5.17.0",
]
pdf-vlm = [
    "docling[vlm]==2.130.0",
    "docling-core==2.98.0",
    "docling-ibm-models==4.0.3",
    "docling-parse==7.21.0",
    "rapidocr==3.9.2",
    "transformers==5.17.0",
]

[project.scripts]
research-ingest = "research_platform.ingestion.cli:main"
research-maintenance = "research_platform.maintenance.cli:main"
research-migrate = "research_platform.persistence.migrations:main"
research-runs = "research_platform.runs.cli:main"
research-eval = "research_platform.evaluation.cli:main"
research-keys = "research_platform.auth.cli:main"
research-worker = "research_platform.worker.main:main"
research-demo = "research_platform.demo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
research_platform = ["api/static/*.html", "api/static/*.js", "api/static/*.css"]


[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
files = ["src/research_platform"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
markers = [
    "integration: requires dedicated disposable PostgreSQL and Qdrant services",
    "browser: Playwright browser journeys",
]
