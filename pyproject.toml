[build-system]
requires =["setuptools"]
build-backend ="setuptools.build_meta"

[project]
name = "scientific-research-platform"
version = "0.1.0"
description = "A scientific literature research platform"
dependencies = [
    "asyncpg",
    "fastapi",
    "httpx",
    "uvicorn",
]

[project.optional-dependencies]
pdf = [
    "docling==2.130.0",
    "docling-core==2.98.0",
    "docling-ibm-models==4.0.3",
    "docling-parse==7.21.0",
    "rapidocr==3.9.2",
]
embeddings = [
    "sentence-transformers==6.1.0",
]
pdf-vlm = [
    "docling[vlm]==2.130.0",
    "docling-core==2.98.0",
    "docling-ibm-models==4.0.3",
    "docling-parse==7.21.0",
    "rapidocr==3.9.2",
    "transformers==5.17.0",
]

[project.scripts]
research-ingest = "research_platform.ingestion.cli:main"

[tool.setuptools.packages.find]
where = ["src"]


[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
files = ["src/research_platform"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
markers = ["integration: requires dedicated disposable PostgreSQL and Qdrant services"]
