<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Research UI Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!--
  PROTOTYPE (P6-22, ADR-0034). Throwaway. Fake data only. Not served by the API.
  Question: what should the research UI at / look like?
  Three structurally different layouts, switchable from the floating bar (or ?variant=A|B|C):
    A Workbench  - sidebar with run history, run page split into answer | run-record tabs
    B Report     - top navigation, run page reads as a document with a narrative timeline
    C Console    - dense full-width, run page centred on a waterfall with an inspector
  Search, paper page, run form and run list are shared; the shell and the run page differ.
  The real page's CSP forbids web fonts, so only system faces are used here.
-->
<style>
/* Layout: one shell per variant over shared views; the run page carries the comparison. */
:root {
  --bg: #f6f7f8;
  --surface: #ffffff;
  --sunk: #eceff1;
  --fg: #1b2328;
  --muted: #5d6a72;
  --line: #d5dbdf;
  --accent: #1d5c78;
  --accent-soft: #dcebf2;
  --mark: #fff1b8;
  --ok: #1e7a4c;
  --ok-soft: #dcf1e5;
  --warn: #93600b;
  --warn-soft: #fbedd2;
  --bad: #a63a32;
  --bad-soft: #f8e0dd;
  --bar-bg: #1b2328;
  --bar-fg: #f6f7f8;
  --ui: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --read: "Iowan Old Style", "Charter", "Bitstream Charter", "Sitka Text", Cambria, Georgia, serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", "Segoe UI Mono", Menlo, Consolas, monospace;
  --s1: .25rem; --s2: .5rem; --s3: .75rem; --s4: 1rem; --s5: 1.5rem; --s6: 2.25rem;
  --r: .375rem;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12171a; --surface: #192024; --sunk: #0e1214; --fg: #e3e8eb; --muted: #95a3ab;
    --line: #2c363c; --accent: #7cc0dc; --accent-soft: #1b3440; --mark: #4a3f12;
    --ok: #6fcf9a; --ok-soft: #173326; --warn: #e6b45c; --warn-soft: #3a2d12;
    --bad: #f08b80; --bad-soft: #3d1d1a; --bar-bg: #e3e8eb; --bar-fg: #12171a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12171a; --surface: #192024; --sunk: #0e1214; --fg: #e3e8eb; --muted: #95a3ab;
  --line: #2c363c; --accent: #7cc0dc; --accent-soft: #1b3440; --mark: #4a3f12;
  --ok: #6fcf9a; --ok-soft: #173326; --warn: #e6b45c; --warn-soft: #3a2d12;
  --bad: #f08b80; --bad-soft: #3d1d1a; --bar-bg: #e3e8eb; --bar-fg: #12171a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--ui); font-size: 15px; line-height: 1.5; padding-bottom: 5rem; }
h1, h2, h3 { text-wrap: balance; line-height: 1.25; margin: 0; }
h1 { font-size: 1.45rem; font-weight: 650; }
h2 { font-size: 1.05rem; font-weight: 650; }
h3 { font-size: .95rem; font-weight: 600; }
p { margin: 0; }
a, .link { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; cursor: pointer; background: none; border: 0; padding: 0; font: inherit; text-align: left; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.muted { color: var(--muted); }
.mono { font-family: var(--mono); font-size: .86em; }
.num { font-variant-numeric: tabular-nums; }
.eyebrow { font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.stack { display: flex; flex-direction: column; gap: var(--s3); }
.row { display: flex; flex-wrap: wrap; gap: var(--s2); align-items: center; }
.spread { display: flex; flex-wrap: wrap; gap: var(--s3); align-items: baseline; justify-content: space-between; }
.min0 { min-width: 0; }
.banner { background: var(--warn-soft); color: var(--warn); font-size: .8rem; padding-block: .35rem; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.pill { display: inline-flex; align-items: center; gap: .3rem; font-size: .74rem; font-weight: 600; padding: .1rem .5rem; border-radius: 999px; background: var(--sunk); color: var(--muted); white-space: nowrap; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }

@media (prefers-reduced-motion: reduce) { .pill.live::before { animation: none; } }

.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.btn.danger { color: var(--bad); border-color: var(--bad); background: transparent; }

input, textarea, select { font: inherit; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: .4rem .55rem; max-width: 100%; }
textarea { width: 100%; min-height: 5rem; resize: vertical; }
label { font-size: .85rem; font-weight: 550; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: .35rem .8rem; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--surface); }
.quote { font-family: var(--read); font-size: 1.02rem; line-height: 1.55; border-left: 3px solid var(--accent); padding-left: var(--s3); margin: 0; }
.quote mark { background: var(--mark); color: inherit; padding: 0 .1em; }
.tablewrap { overflow-x: auto; max-width: 100%; }

.role { font-size: .7rem; letter-spacing: .06em; text-transform: uppercase; font-weight: 700; color: var(--muted); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: var(--s4); }
dl.kv { display: grid; grid-template-columns: max-content 1fr; gap: .3rem var(--s4); margin: 0; font-size: .85rem; }

.hit { display: flex; flex-direction: column; gap: var(--s2); padding-block: var(--s3); border-bottom: 1px solid var(--line); }
.hit:last-child { border-bottom: 0; }
.crumbs { font-size: .8rem; color: var(--muted); }
.formgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(9rem, 1fr)); gap: var(--s3); align-items: end; }
.field { display: flex; flex-direction: column; gap: .25rem; min-width: 0; }

/* ---------- floating switcher (prototype only) ---------- */
.switcher { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); z-index: 50; display: flex; align-items: center; gap: .4rem; background: var(--bar-bg); color: var(--bar-fg); border-radius: 999px; padding: .3rem .4rem; box-shadow: 0 6px 24px rgba(0,0,0,.28); font-size: .82rem; max-width: calc(100vw - 24px); flex-wrap: wrap; justify-content: center; }
.switcher button { background: transparent; color: inherit; border: 1px solid transparent; border-radius: 999px; padding: .2rem .6rem; }
.switcher button:hover { border-color: currentColor; }
.switcher .lbl { font-weight: 700; padding: 0 .3rem; white-space: nowrap; }
.switcher .sep { width: 1px; align-self: stretch; background: currentColor; opacity: .3; }

/* ---------- Variant A: Workbench ---------- */
.vA { display: grid; grid-template-columns: 16rem 1fr; min-height: 100vh; }
.vA aside { background: var(--surface); border-right: 1px solid var(--line); padding: var(--s4); padding-left: max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: var(--s4); }
.vA .brand { font-weight: 700; letter-spacing: -.01em; }

.vA nav button { text-align: left; border: 0; background: transparent; padding: .4rem .6rem; border-radius: var(--r); }
.vA nav button[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.vA .recent button { display: flex; flex-direction: column; gap: 2px; align-items: flex-start; text-align: left; width: 100%; border: 0; background: transparent; padding: .45rem .5rem; border-radius: var(--r); }
.vA .recent button:hover, .vA nav button:hover { background: var(--sunk); }
.vA .recent .q { font-size: .82rem; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.vA main { padding: var(--s5); padding-right: max(16px, env(safe-area-inset-right, 0px)); min-width: 0; }
.vA .runsplit { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: var(--s5); align-items: start; }
.vA .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.vA .tabs button { border: 0; background: transparent; padding: .45rem .7rem; border-bottom: 2px solid transparent; white-space: nowrap; }
.vA .tabs button[aria-selected="true"] { border-color: var(--accent); color: var(--accent); font-weight: 600; }
.vA .claim { display: flex; flex-direction: column; gap: var(--s2); padding: var(--s4); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.vA .step { display: grid; grid-template-columns: 1.6rem 1fr auto; gap: var(--s2); padding-block: var(--s2); border-bottom: 1px solid var(--line); align-items: start; }
.vA .step .k { font-family: var(--mono); font-size: .72rem; color: var(--muted); padding-top: .15rem; }
.vA .sticky { position: sticky; top: calc(var(--s4) + env(safe-area-inset-top, 0px)); }
@media (max-width: 60rem) { .vA .runsplit { grid-template-columns: 1fr; } .vA .sticky { position: static; } }
@media (max-width: 44rem) { .vA { grid-template-columns: 1fr; } .vA aside { border-right: 0; border-bottom: 1px solid var(--line); padding-right: max(16px, env(safe-area-inset-right, 0px)); } .vA .recent { display: none; } .vA nav { flex-direction: row; flex-wrap: wrap; } .vA main { padding-left: max(16px, env(safe-area-inset-left, 0px)); } }

/* ---------- Variant B: Report ---------- */
.vB header { background: var(--surface); border-bottom: 1px solid var(--line); padding-block: var(--s3); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.vB header .in { max-width: 46rem; margin: 0 auto; display: flex; flex-wrap: wrap; gap: var(--s4); align-items: center; justify-content: space-between; }
.vB header nav { display: flex; gap: var(--s4); flex-wrap: wrap; font-size: .9rem; }
.vB header nav button { border: 0; background: transparent; padding: .2rem 0; border-bottom: 2px solid transparent; }
.vB header nav button[aria-current="page"] { border-color: var(--fg); font-weight: 600; }
.vB main { max-width: 46rem; margin: 0 auto; padding-block: var(--s6); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: var(--s6); }
.vB .doc h1 { font-family: var(--read); font-size: 1.85rem; font-weight: 600; line-height: 1.2; }
.vB .answer { font-family: var(--read); font-size: 1.12rem; line-height: 1.7; }
.vB .answer sup button { font-family: var(--ui); font-size: .7rem; font-weight: 700; color: var(--accent); background: var(--accent-soft); border: 0; border-radius: 3px; padding: 0 .3rem; margin-left: 1px; }
.vB section > h2 { font-family: var(--read); font-size: 1.25rem; font-weight: 600; padding-bottom: var(--s2); border-bottom: 1px solid var(--line); margin-bottom: var(--s4); }
.vB ol.notes { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: var(--s5); counter-reset: n; }
.vB ol.notes > li { display: grid; grid-template-columns: 2rem 1fr; gap: var(--s2); }
.vB ol.notes > li > .n { font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }

@keyframes flash { from { background: var(--mark); } }
.vB .story { list-style: none; margin: 0; padding: 0 0 0 1.25rem; border-left: 2px solid var(--line); display: flex; flex-direction: column; gap: var(--s4); }
.vB .story > li { position: relative; display: flex; flex-direction: column; gap: var(--s1); }
.vB .story > li::before { content: ""; position: absolute; left: calc(-1.25rem - 6px); top: .45rem; width: 10px; height: 10px; border-radius: 50%; background: var(--surface); border: 2px solid var(--accent); }
.vB .story > li.model::before { background: var(--accent); }
.vB .story > li.fail::before { border-color: var(--bad); }
.vB .story > li.pending::before { border-style: dashed; }
.vB details > summary { cursor: pointer; color: var(--accent); font-size: .85rem; }
.vB .dropped { border-left: 3px solid var(--bad); padding-left: var(--s3); display: flex; flex-direction: column; gap: var(--s1); }

/* ---------- Variant C: Console ---------- */
.vC { font-size: 14px; }
.vC .topbar { display: flex; flex-wrap: wrap; gap: var(--s4); align-items: center; padding-block: .45rem; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--surface); border-bottom: 1px solid var(--line); }

.vC .panel > .ph { display: flex; justify-content: space-between; align-items: center; gap: var(--s2); padding: .45rem var(--s3); border-bottom: 1px solid var(--line); font-size: .78rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }

.vC .wf { display: grid; grid-template-columns: 11rem 1fr 4.5rem; font-size: .8rem; }
.vC .wf > * { padding: .28rem .4rem; border-bottom: 1px solid var(--line); min-width: 0; }
.vC .wf .name { font-family: var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.vC .wf .lane { position: relative; }
.vC .wf .lane .b { position: absolute; top: 28%; height: 44%; border-radius: 2px; background: var(--accent); min-width: 3px; }
.vC .wf .lane .b.model { background: var(--warn); }
.vC .wf .lane .b.failed { background: var(--bad); }

.vC .wf .lane .b.open { background: repeating-linear-gradient(90deg, var(--warn) 0 6px, transparent 6px 10px); }

@media (max-width: 62rem) { .vC .runhead, .vC .work { grid-template-columns: 1fr; } }
@media (max-width: 34rem) { .vC .wf { grid-template-columns: 7rem 1fr 3.5rem; } .meter { grid-template-columns: 6rem 1fr 4.5rem; } }

<script>
"use strict";
(function () {
  // ---------- tiny DOM helper (text only, as in production) ----------
  function h(tag, attrs) {
    const el = document.createElement(tag);
    if (attrs) for (const k in attrs) {
      const v = attrs[k];
      if (v === undefined || v === null || v === false) continue;
      if (k === "class") el.className = v;
      else if (k === "text") el.textContent = String(v);
      else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
      else if (k === "style") el.setAttribute("style", v);
      else el.setAttribute(k, v === true ? "" : String(v));
    }
    for (let i = 2; i < arguments.length; i++) add(el, arguments[i]);
    return el;
  }
  function add(el, c) {
    if (c === undefined || c === null || c === false) return;
    if (Array.isArray(c)) c.forEach(function (x) { add(el, x); });
    else if (c instanceof Node) el.appendChild(c);
    else el.appendChild(document.createTextNode(String(c)));
  }
  function fmtS(s) { s = Math.round(s); return s >= 60 ? Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0") : s + " s"; }
  function fmtMs(ms) { return ms >= 1000 ? (ms / 1000).toFixed(ms >= 10000 ? 0 : 1) + " s" : Math.round(ms) + " ms"; }
  function n(x) { return x.toLocaleString("en-US"); }

  // ---------- fake data ----------
  const PAPERS = {
    W1: { id: "W4389120441", title: "Cross-Encoder Reranking for Retrieval-Augmented Question Answering", authors: "L. Varga, M. Okafor, J. Lindqvist", year: 2023, venue: "Findings of ACL", licence: "CC BY 4.0", doi: "10.18653/v1/2023.findings-acl.000", abstract: "We study whether reranking retrieved passages with a cross-encoder improves the answers of a retrieval-augmented generator. Across four open-domain question answering datasets, reranking the top 100 passages raises exact match by 2.1 to 4.8 points over the retriever's own order, at a median cost of 180 ms per question on one GPU." },
    W2: { id: "W4392008817", title: "When Does Reranking Help? Passage Rerankers in RAG Pipelines", authors: "S. Haddad, P. Moreau", year: 2024, venue: "TACL", licence: "CC BY 4.0", doi: "10.1162/tacl_a_00000", abstract: "Rerankers are widely added to RAG pipelines, but their benefit depends on the first-stage retriever. We find large gains over BM25 and small or no gains over strong dense retrievers, and report where the extra latency is not repaid." },
    W3: { id: "W4313577202", title: "Hybrid Sparse–Dense Retrieval for Scientific Literature", authors: "K. Iyer, T. Brandt", year: 2022, venue: "SDP Workshop", licence: "CC BY 4.0", doi: "10.18653/v1/2022.sdp-1.000", abstract: "Combining lexical and dense retrieval with reciprocal rank fusion improves recall on scientific question answering, particularly for queries that contain rare technical terms." },
    W4: { id: "W4396631190", title: "Evidence Order Effects in Long-Context Generation", authors: "A. Nakamura, R. Silva", year: 2024, venue: "EMNLP", licence: "CC BY 4.0", doi: "10.18653/v1/2024.emnlp-main.000", abstract: "Generators use evidence unevenly across their context. Placing reranked passages first reduces unsupported statements in generated answers." },
    W5: { id: "W4385299316", title: "Late-Interaction Rerankers on a Budget", authors: "D. Petrov", year: 2023, venue: "SIGIR Short Papers", licence: "CC BY 4.0", doi: "10.1145/0000000.0000000", abstract: "Late-interaction models approach cross-encoder quality at a fraction of the latency when the candidate set is small." },
    W6: { id: "W4402873355", title: "A Benchmark of Reranking Methods for Open-Domain QA", authors: "M. Okafor, E. Duarte, H. Kim", year: 2025, venue: "LREC-COLING", licence: "CC BY 4.0", doi: "10.18653/v1/2025.lrec-main.000", abstract: "We compare eleven reranking methods on six open-domain QA datasets under one evaluation protocol and release the harness." }
  };
