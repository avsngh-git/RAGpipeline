schema_version = 1
# Owner-approved 2026-09-30 (ADR-0015, ADR-0016). Applies only to a fresh held-out set frozen after this file.
# [calibration] and [development_source_anchors] are historical P2-14 development limits, kept unchanged.
acceptance_id = "phase2-acceptance-v14"
reviewer = "assistant"
benchmark_split = "phase2-benchmark-v14"
selected_profile = "unset-until-freeze"  # the profile identity is bound at the v14 freeze
unsupported_query_cutoff = "disabled"
ranking_interpretation = "ranking_only"

[calibration]
minimum_paper_ndcg_at_10 = 0.80
minimum_paper_direct_mrr_at_10 = 0.80
minimum_paper_judged_recall_at_20 = 0.90
minimum_evidence_ndcg_at_10 = 0.45
minimum_evidence_direct_mrr_at_10 = 0.45
minimum_evidence_judged_recall_at_20 = 0.60

[development_source_anchors]
minimum_micro_recall_at_10 = 0.25
minimum_micro_recall_at_50 = 0.35
minimum_positive_families_with_at_least_one_at_10 = 5
positive_family_count = 7
anchor_count = 31

[heldout]
minimum_paper_ndcg_at_10 = 0.65
minimum_paper_direct_mrr_at_10 = 0.70
minimum_paper_judged_recall_at_20 = 0.90
minimum_evidence_ndcg_at_10 = 0.40
minimum_evidence_direct_mrr_at_10 = 0.45
minimum_evidence_judged_recall_at_20 = 0.50
minimum_source_anchor_recall_at_10 = 0.25
minimum_source_anchor_recall_at_50 = 0.35
minimum_positive_families_with_source_hit_at_10_fraction = 0.50

[operations]
maximum_hard_failure_fraction = 0.01
maximum_reranker_fallback_fraction = 0.35
maximum_warm_p95_ms = 5000
maximum_combined_cold_model_load_ms = 15000
maximum_summed_cuda_allocated_bytes = 1073741824
request_deadline_seconds = 30
reranker_pair_budget_tokens = 512
candidate_pool_limit = 50
default_result_limit = 10

[selection]
paper_score_policy = "strongest_passage"
paper_support_limit = 5
evidence_per_paper_limit = 5
evidence_result_character_budget = 12000
evidence_result_token_budget = 4000
