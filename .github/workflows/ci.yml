name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: research_test
          POSTGRES_USER: research
          POSTGRES_PASSWORD: research
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U research -d research_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      qdrant:
        image: qdrant/qdrant:v1.14.1
        ports:
          - 6333:6333

    steps:
      - uses: actions/checkout@v4

      - name: Set up Miniforge
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: base
          auto-activate-base: true

      - name: Create the locked Conda environment
        run: conda create --yes --name sci_research_agent --file environment-linux-64.lock

      - name: Install the package
        run: conda run --name sci_research_agent python -m pip install --no-build-isolation --no-deps -e .

      - name: Lint
        run: conda run --name sci_research_agent python -m ruff check .

      - name: Check formatting
        run: conda run --name sci_research_agent python -m ruff format --check .

      - name: Type check
        run: conda run --name sci_research_agent python -m mypy

      - name: Unit, API, and service integration tests
        env:
          RESEARCH_PLATFORM_TEST_DATABASE_URL: postgresql://research:research@127.0.0.1:5432/research_test
          RESEARCH_PLATFORM_TEST_QDRANT_URL: http://127.0.0.1:6333
        run: conda run --name sci_research_agent python -m pytest

      - name: Apply migration against PostgreSQL service
        env:
          RESEARCH_PLATFORM_DATABASE_URL: postgresql://research:research@127.0.0.1:5432/research_test
        run: conda run --name sci_research_agent python scripts/migrate.py

      - name: Dependency checks
        run: |
          conda run --name sci_research_agent python -m pip check
          conda run --name sci_research_agent python -m pip_audit --skip-editable

      - name: Build Docker image
        run: docker build --platform linux/amd64 --tag scientific-research-platform:ci .
