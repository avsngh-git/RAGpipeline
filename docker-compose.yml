services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-research}
      POSTGRES_USER: ${POSTGRES_USER:-research}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-research}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.19.1@sha256:12364fe851b9f17356fc88189fc06d1b521262e04659ec7345975b00c9246a10
    ports:
      - "127.0.0.1:${QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant_data_v1_19:/qdrant/storage

  api:
    platform: linux/amd64
    image: ${RESEARCH_PLATFORM_IMAGE:-ghcr.io/avsngh-git/ragpipeline:latest}
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      RESEARCH_PLATFORM_ENVIRONMENT: ${RESEARCH_PLATFORM_ENVIRONMENT:-development}
      RESEARCH_PLATFORM_LOG_LEVEL: ${RESEARCH_PLATFORM_LOG_LEVEL:-INFO}
      RESEARCH_PLATFORM_DATABASE_URL: postgresql://${POSTGRES_USER:-research}:${POSTGRES_PASSWORD:-research}@postgres:5432/${POSTGRES_DB:-research}
      RESEARCH_PLATFORM_QDRANT_URL: http://qdrant:6333
      RESEARCH_PLATFORM_EVIDENCE_ACCESS_PROFILE: trusted_private_local
      RESEARCH_PLATFORM_MODEL_DEVICE: ${RESEARCH_PLATFORM_MODEL_DEVICE:-cpu}
      HF_HOME: /models/hf
      RESEARCH_PLATFORM_RERANKER_CACHE_DIR: /models/reranker
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-1}
      TRANSFORMERS_OFFLINE: ${HF_HUB_OFFLINE:-1}
      RESEARCH_PLATFORM_LLM_BASE_URL: ${RESEARCH_PLATFORM_LLM_BASE_URL:-http://ollama:11434}
      RESEARCH_PLATFORM_LLM_MODEL: ${RESEARCH_PLATFORM_LLM_MODEL:-qwen3.5-2b-text:q4_k_m}
      OPENALEX_API_KEY: ${OPENALEX_API_KEY:-}
      RESEARCH_PLATFORM_DEPENDENCY_TIMEOUT_SECONDS: ${RESEARCH_PLATFORM_DEPENDENCY_TIMEOUT_SECONDS:-2}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - ./data/artifacts:/app/data/artifacts
      - model_cache:/models
      - ./demo-data:/demo-data:ro
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 60
      start_period: 60s

  ollama:
    image: ollama/ollama:0.35.0@sha256:2a6e883b917fc543389599dae79918f5cac9e1438890506982f44aa4f5625d01
    profiles: ["llm"]
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    environment:
      # The research API sends num_ctx with every call (RESEARCH_PLATFORM_LLM_CONTEXT_TOKENS,
      # default 32768), which overrides this server default; keep the two equal.
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-32768}
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: ${OLLAMA_KV_CACHE_TYPE:-f16}
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_KEEP_ALIVE: 30m
      # llama-server's host-RAM prompt cache defaults to 8,192 MiB and Ollama 0.35.0
      # passes no --cache-ram flag, so the cache was OOM-killed on an 11.7 GiB VM.
      # llama.cpp reads LLAMA_ARG_CACHE_RAM in place of the flag (ollama#18264).
      LLAMA_ARG_CACHE_RAM: ${LLAMA_ARG_CACHE_RAM:-1024}
    volumes:
      - ollama_models:/root/.ollama
      - ./local-reference/phase3-models:/models-import:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  model_cache:
  postgres_data:
  qdrant_data_v1_19:
  ollama_models:
